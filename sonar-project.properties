# What a SonarQube scan of this repository covers. Run it with `npm run sonar`, which also
# measures test coverage first. The server address and the token come from the environment
# (SONAR_HOST_URL, SONAR_TOKEN or SONARQUBE_TOKEN), never from this file.
sonar.projectKey=opencode-monitor
sonar.projectName=opencode-monitor
sonar.sourceEncoding=UTF-8

sonar.sources=src,server.mjs,mcp.mjs,scripts,dashboard/app,dashboard/components,dashboard/lib
sonar.tests=test,dashboard/components,dashboard/lib
sonar.test.inclusions=test/**,**/*.test.ts,**/*.test.tsx
# components/ui is generated by shadcn/ui; public/ is the built page and is not a source.
sonar.exclusions=**/node_modules/**,dashboard/components/ui/**,**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/server.lcov,coverage/page.lcov
